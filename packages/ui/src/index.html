<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hebrew Feasts</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://api.hebrewfeasts.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com;">

    <!-- Google Analytics (GA4), routed first-party through api.hebrewfeasts.com/sync so
         tracker blockers (which block googletagmanager.com / google-analytics.com) don't
         drop it. Only runs on the live domain — localhost/preview stay untracked. -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || []
        function gtag() { dataLayer.push(arguments) }
        window.gtag = gtag
        gtag('js', new Date())
        if (!/(^|\.)hebrewfeasts\.com$/.test(location.hostname)) return
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://api.hebrewfeasts.com/sync/gtag/js?id=G-MH4XYVN0M8'
        document.head.appendChild(s)
        gtag('config', 'G-MH4XYVN0M8', {
          transport_url: 'https://api.hebrewfeasts.com/sync'
        })
      })()
    </script>

    <meta
      name="description"
      content="A calendar for all Jewish Feasts back to 1 AD" />
    <meta name="author" content="Hebrew Feasts" />
    <meta name="keywords" content="Hebrew Feasts" />

    <meta property="og:title" content="Hebrew Feasts" />
    <meta
      property="og:description"
      content="A calendar for all Jewish Feasts back to 1 AD" />
    <meta property="og:image" content="/og.png" />

    <meta name="twitter:title" content="Hebrew Feasts" />

    <meta
      name="twitter:description"
      content="A calendar for all Jewish Feasts back to 1 AD" />
    <meta name="twitter:image" content="/og.png" />
    
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/styles.css">

    <!-- Default to dark (like the timeline) and pre-paint the ground to avoid a white flash. -->
    <script>
      (function () {
        try {
          var k = 'chakra-ui-color-mode'
          if (!localStorage.getItem(k)) localStorage.setItem(k, 'dark')
          document.documentElement.style.background =
            localStorage.getItem(k) === 'light' ? '#f5f4f0' : '#0d1020'
        } catch (e) {}
      })()
    </script>

    <script id="env-vars"></script>
    <script type="module" src="/index.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
