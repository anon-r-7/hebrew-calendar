<style>
/* ============================ TOKENS ============================ */
:root{
  --ground:#f5f4f0; --ground-2:#eceae3; --surface:#ffffff; --surface-2:#faf9f5;
  --ink:#24211b; --ink-soft:#5f5849; --ink-faint:#968f7e;
  --hair:#e6e2d8; --hair-soft:#eeebe3;
  --gold:#9a7410; --gold-line:#c19a2b; --gold-soft:#efe7cd;
  --accent:#a83a29;
  --shadow:0 1px 2px rgba(30,26,16,.05), 0 8px 22px rgba(30,26,16,.07);
  --shadow-lift:0 2px 6px rgba(30,26,16,.08), 0 18px 44px rgba(30,26,16,.13);
  /* confidence tiers (light) */
  --t-anchor:#9c7410; --t-locked:#2c7756; --t-given:#2f5aa0; --t-historical:#626879;
  --t-derived:#a86e19; --t-traditional:#67479c; --t-interpretive:#a83a29;
  --track:150px; --headw:250px; --c:var(--gold);
  /* Global 4-colour card palette (used across all sections; muted so the neutral band lets them read) */
  --c-green:#2c6b3a; --c-gold:#986c10; --c-blue:#585aa4; --c-grey:#6e6a62; --c-purple:#8a3fa8;
  /* church-history branches (dot colour) */
  --grp-early:var(--c-green); --grp-orthodox:var(--c-blue); --grp-catholic:var(--c-gold);
  --grp-protestant:var(--c-purple); --grp-empire:var(--c-grey);
  --grp-birth:var(--c-green); --grp-restoration:var(--c-green); --grp-messiah:var(--c-green);
  --grp-conquest:var(--c-green); --grp-deliverer:var(--c-green); --grp-maccabees:var(--c-green); --grp-mission:var(--c-green);
  --grp-covenant:var(--c-gold); --grp-kingdom:var(--c-gold); --grp-martyr:var(--c-gold);
  --grp-death:var(--c-grey); --grp-powers:var(--c-grey); --grp-judgment:var(--c-grey); --grp-event:var(--c-grey);
  --grp-church:var(--c-blue); --grp-temple:var(--c-blue); --grp-exodus:var(--c-blue); --grp-prophet:var(--c-blue);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1020; --ground-2:#141833; --surface:#181c30; --surface-2:#1e2440;
  --ink:#ece5d3; --ink-soft:#a7a08d; --ink-faint:#7c7666;
  --hair:#282d47; --hair-soft:#222741;
  --gold:#dbb856; --gold-line:#c7a340; --gold-soft:#5a4d24;
  --accent:#e07a5f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 22px 50px rgba(0,0,0,.6);
  --t-anchor:#e0c063; --t-locked:#5cbd93; --t-given:#78a2e6; --t-historical:#9aa2b6;
  --t-derived:#e2a94e; --t-traditional:#b492e8; --t-interpretive:#e07a5f;
  --c-green:#5eb974; --c-gold:#e3b153; --c-blue:#9d97dd; --c-grey:#aca69c; --c-purple:#c48ee0;
}}
:root[data-theme="dark"]{
  --ground:#0d1020; --ground-2:#141833; --surface:#181c30; --surface-2:#1e2440;
  --ink:#ece5d3; --ink-soft:#a7a08d; --ink-faint:#7c7666;
  --hair:#282d47; --hair-soft:#222741;
  --gold:#dbb856; --gold-line:#c7a340; --gold-soft:#5a4d24;
  --accent:#e07a5f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 22px 50px rgba(0,0,0,.6);
  --t-anchor:#e0c063; --t-locked:#5cbd93; --t-given:#78a2e6; --t-historical:#9aa2b6;
  --t-derived:#e2a94e; --t-traditional:#b492e8; --t-interpretive:#e07a5f;
  --c-green:#5eb974; --c-gold:#e3b153; --c-blue:#9d97dd; --c-grey:#aca69c; --c-purple:#c48ee0;
}

/* ============================ BASE ============================ */
*{ box-sizing:border-box; }
body{ background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased; }
.page{ max-width:100%; }
.mono{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; }
h1,h2,h3,.disp{ font-family:"Fraunces","Fraunces 144",Georgia,serif; font-weight:600; text-wrap:balance; }
a{ color:inherit; }
::selection{ background:var(--gold-soft); color:var(--ink); }

/* ============================ HERO ============================ */
.hero{ padding:clamp(30px,6vw,74px) clamp(20px,5vw,64px) clamp(20px,3vw,32px);
  border-bottom:1px solid var(--hair);
  background:
    radial-gradient(120% 130% at 84% -20%, color-mix(in oklab, var(--gold-soft) 55%, transparent), transparent 58%),
    linear-gradient(var(--ground), var(--ground)); }
.eyebrow{ font-size:11.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold);
  font-weight:600; margin:0 0 18px; }
.eyebrow .sep{ opacity:.5; padding:0 .55em; }
.hero h1{ font-size:clamp(38px,7.2vw,86px); line-height:.98; letter-spacing:-.01em; margin:0;
  font-weight:600; max-width:16ch; }
.hero h1 em{ font-style:italic; font-weight:500; color:var(--gold); }
.lead{ margin:22px 0 0; max-width:64ch; font-size:clamp(15px,1.5vw,18px); color:var(--ink-soft); }
.lead b{ color:var(--ink); font-weight:600; }
.stats{ list-style:none; display:flex; flex-wrap:wrap; gap:0; margin:30px 0 0; padding:0; }
.stats li{ padding:2px 26px 2px 0; margin-right:26px; border-right:1px solid var(--hair); }
.stats li:last-child{ border-right:0; }
.stats .n{ font-size:26px; font-weight:600; display:block; letter-spacing:-.01em; }
.stats .k{ font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint); }

/* ============================ CONTROLS ============================ */
.controls{ position:sticky; top:0; z-index:40; background:color-mix(in oklab, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hair); }
.controls-row{ display:flex; align-items:center; gap:12px 14px; flex-wrap:wrap;
  padding:12px clamp(16px,4vw,44px); }
.controls-row.two{ padding-top:0; border-top:0; }
.wordmark{ font-family:"Fraunces",serif; font-weight:600; font-size:16px; color:var(--ink);
  letter-spacing:.01em; display:inline-flex; align-items:baseline; gap:10px; }
.wm-sub{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:400;
  letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
@media (max-width:620px){ .wm-sub{ display:none; } }
.chips{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.chip{ display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  font:inherit; font-size:12.5px; color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--hair); border-radius:999px;
  padding:5px 11px 5px 9px; transition:.16s ease; user-select:none; }
.chip:hover{ border-color:var(--ink-faint); color:var(--ink); }
.chip .mk{ width:11px; height:11px; border-radius:50%; background:var(--c,currentColor);
  border:1.5px solid var(--c,currentColor); flex:none; }
.chip.hollow .mk{ background:transparent; }
.chip[aria-pressed="false"]{ opacity:.34; }
.chip .ct{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint); }
.btn{ font:inherit; font-size:12.5px; font-weight:500; cursor:pointer; color:var(--ink);
  background:var(--surface); border:1px solid var(--hair); border-radius:999px; padding:6px 14px;
  transition:.16s ease; }
.btn:hover{ border-color:var(--ink-faint); }
.btn.on{ background:var(--ink); color:var(--ground); border-color:var(--ink); }
.spacer{ flex:1 1 auto; }
.search-row{ position:relative; justify-content:center; padding:18px clamp(16px,4vw,44px); }
.search{ font:inherit; font-size:16px; color:var(--ink); background:var(--surface);
  border:1px solid var(--hair); border-radius:999px; padding:12px 22px; width:100%;
  max-width:540px; text-align:center; box-shadow:var(--shadow); transition:border-color .16s ease; }
.search:hover{ border-color:var(--ink-faint); }
.search:focus{ border-color:var(--gold); }
.search::placeholder{ color:var(--ink-faint); text-align:center; }
.theme-corner{ position:absolute; right:clamp(16px,4vw,44px); top:50%; transform:translateY(-50%); }
.search:focus-visible,.btn:focus-visible,.chip:focus-visible,.stage:focus-visible,.pill:focus-visible,.icon-btn:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px; }
.count{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
  letter-spacing:.02em; white-space:nowrap; }
.icon-btn{ font:inherit; cursor:pointer; background:var(--surface); border:1px solid var(--hair);
  border-radius:50%; width:34px; height:34px; display:grid; place-items:center; color:var(--ink);
  font-size:15px; transition:.16s ease; }
.icon-btn:hover{ border-color:var(--ink-faint); }
.eranav{ display:flex; gap:6px; overflow-x:auto; padding:0 clamp(16px,4vw,44px) 11px;
  scrollbar-width:none; }
.eranav::-webkit-scrollbar{ display:none; }
.pill{ font:inherit; font-size:12px; white-space:nowrap; cursor:pointer; color:var(--ink-soft);
  background:transparent; border:1px solid var(--hair); border-radius:999px; padding:4px 12px;
  transition:.16s ease; display:inline-flex; gap:7px; align-items:baseline; }
.pill:hover{ color:var(--ink); border-color:var(--ink-faint); }
.pill .rn{ font-family:"Fraunces",serif; color:var(--gold); font-weight:600; }
.pill.active{ background:var(--surface-2); border-color:var(--gold); color:var(--ink); }
.legend-note{ font-size:12px; color:var(--ink-faint); padding:0 clamp(16px,4vw,44px) 11px;
  display:flex; gap:20px; flex-wrap:wrap; }
.legend-note .g{ display:inline-flex; align-items:center; gap:8px; }
.legend-note .mk{ width:11px; height:11px; border-radius:50%; border:1.5px solid var(--ink-faint); flex:none; }
.legend-note .mk.solid{ background:var(--ink-faint); }

/* Confidence key + Relative toggle (the key teaches the dot SHAPE language;
   colour on real dots carries the thematic group instead). */
.keyrow{ padding-top:0; padding-bottom:11px; gap:10px 16px; align-items:baseline; }
.ckey{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; }
.ckey .ci{ display:inline-flex; align-items:center; gap:7px; font:inherit; font-size:11.5px;
  color:var(--ink-soft); letter-spacing:.01em; white-space:nowrap; cursor:pointer;
  background:var(--surface); border:1px solid var(--hair); border-radius:999px; padding:4px 11px 4px 9px;
  transition:.16s ease; }
.ckey .ci:hover{ border-color:var(--ink-faint); color:var(--ink); }
.ckey .ci[aria-pressed="false"]{ opacity:.4; }
.ckey .ci[aria-pressed="false"]:hover{ opacity:.7; }
.ckey .ci .ct{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-faint); }
.ckey-hint{ font-size:10.5px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; }
@media (max-width:620px){ .ckey-hint{ display:none; } }
.kd{ width:12px; height:12px; border-radius:50%; flex:none; box-sizing:border-box;
  background:var(--ink-faint); border:2px solid var(--ink-faint); }
.kd.kd-historical{ background:var(--ground); }
.kd.kd-traditional{ background:var(--ground); border-style:dotted; }
.kd.kd-relative{ background:var(--ground); border-style:dashed; }
/* per-card confidence badge (shown when a card is expanded) */
.card .conf{ display:inline-flex; align-items:center; gap:6px; margin-top:8px;
  font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--ink-faint); }
.card .conf .kd{ width:10px; height:10px; border-width:1.5px; }

/* ============================ STAGE / RAIL ============================ */
.stagewrap{ position:relative; }
.stage{ position:relative; }
.rail{ position:relative; }
.rail::before{ content:""; position:absolute; z-index:1; background:var(--gold-line); opacity:.42; }
/* Era ambience: a subtle tint wash + optional faded backdrop image = "movement through the ages" */
.era{ position:relative; --tint:transparent; --era-img:none;
  background:color-mix(in oklab, var(--ink) 4%, var(--ground)); }
/* Era backdrop images (in /timeline/images/<era>.jpg — see images/PROMPTS.md).
   Shown only in DARK mode — they're painted dark/atmospheric; light mode hides them.
   Faded so the cards and spine stay legible; a missing file just drops that backdrop. */
.era::before{ content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background-image:var(--era-img); background-size:cover; background-position:center 32%; opacity:.22; }
.era[data-era="primeval"]::before{ background-position:center center; }
.era[data-era="return"]::before, .era[data-era="between"]::before{ background-position:center bottom; }
:root[data-theme="light"] .era::before{ background-image:none; }
.era-head{ position:relative; z-index:2; background:color-mix(in oklab, var(--tint) 22%, var(--ground)); }
/* Section tints — "Journey of Light": a day-arc across the redemptive story.
   Value peaks at the golden zenith (United) and the Light of Christ (Jesus);
   the darkest indigo falls on the Exile nadir; warm -> cool -> warm throughout. */
.era[data-era="primeval"] { --tint:#9d7330; --era-img:url(/timeline/images/primeval.jpg); } /* Dawn Gold */
.era[data-era="exodus"]   { --tint:#ad7430; --era-img:url(/timeline/images/exodus.jpg); }   /* Ember Amber */
.era[data-era="judges"]   { --tint:#857538; --era-img:url(/timeline/images/judges.jpg); }   /* Olive Bronze */
.era[data-era="united"]   { --tint:#c6a13c; --era-img:url(/timeline/images/united.jpg); }   /* High-Noon Gold */
.era[data-era="divided"]  { --tint:#8f5566; --era-img:url(/timeline/images/divided.jpg); }  /* Dusk Rose */
.era[data-era="exile"]    { --tint:#2e3560; --era-img:url(/timeline/images/exile.jpg); }     /* Midnight Indigo */
.era[data-era="return"]   { --tint:#3d6b86; --era-img:url(/timeline/images/return.jpg); }    /* Pre-Dawn Blue */
.era[data-era="between"]  { --tint:#47786a; --era-img:url(/timeline/images/between.jpg); }   /* Twilight Teal */
.era[data-era="jesus"]    { --tint:#cba148; --era-img:url(/timeline/images/jesus.jpg); }     /* Radiant Gold */
.era[data-era="apostolic"]{ --tint:#c0843a; --era-img:url(/timeline/images/apostolic.jpg); }/* Daylight Amber */
.era[data-era="john"]     { --tint:#9e5433; --era-img:url(/timeline/images/john.jpg); }      /* Sunset Rust */
/* Church age — the arc continues into history. */
.era[data-era="antenicene"] { --tint:#8f4a3a; --era-img:url(/timeline/images/antenicene.jpg); }   /* Ember (the persecuted church) */
.era[data-era="imperial"]   { --tint:#9a7630; --era-img:url(/timeline/images/imperial.jpg); }     /* Imperial Gold (Constantine & councils) */
.era[data-era="byzantine"]  { --tint:#35708a; --era-img:url(/timeline/images/byzantine.jpg); }    /* Byzantine Blue (the East) */
.era[data-era="medieval"]   { --tint:#7a4560; --era-img:url(/timeline/images/medieval.jpg); }     /* Cathedral Plum (Latin Christendom) */
.era[data-era="reformation"]{ --tint:#5b4a94; --era-img:url(/timeline/images/reformation.jpg); }  /* Reformation Violet */
.rn-big{ font-family:"Fraunces",serif; font-weight:600;
  color:color-mix(in oklab, var(--tint) 72%, var(--ink)); line-height:.8;
  letter-spacing:-.02em; }
.era-name{ font-family:"Fraunces",serif; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
.era-blurb{ color:var(--ink-soft); }
.era-meta{ font-family:"IBM Plex Mono",monospace; color:var(--ink-faint); font-size:11px;
  letter-spacing:.02em; }
.era-meta b{ color:var(--gold); font-weight:600; }

.node{ position:relative; }
/* thematic colour groups -> accent colour (dots, card edge, date, connector) */
.g-birth{--c:var(--grp-birth)} .g-death{--c:var(--grp-death)} .g-covenant{--c:var(--grp-covenant)}
.g-exodus{--c:var(--grp-exodus)} .g-kingdom{--c:var(--grp-kingdom)} .g-temple{--c:var(--grp-temple)}
.g-prophet{--c:var(--grp-prophet)} .g-judgment{--c:var(--grp-judgment)} .g-restoration{--c:var(--grp-restoration)}
.g-powers{--c:var(--grp-powers)} .g-maccabees{--c:var(--grp-maccabees)} .g-messiah{--c:var(--grp-messiah)}
.g-church{--c:var(--grp-church)} .g-event{--c:var(--grp-event)}
.g-conquest{--c:var(--grp-conquest)} .g-deliverer{--c:var(--grp-deliverer)} .g-mission{--c:var(--grp-mission)} .g-martyr{--c:var(--grp-martyr)}
/* church-history branches */
.g-early{--c:var(--grp-early)} .g-orthodox{--c:var(--grp-orthodox)} .g-catholic{--c:var(--grp-catholic)}
.g-protestant{--c:var(--grp-protestant)} .g-empire{--c:var(--grp-empire)}
/* card type marker (church-history: council / leader / mission / schism / empire / martyr / writing) */
.tmark{ font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1; color:var(--c);
  opacity:.9; margin-right:5px; flex:none; }
.card .conf .sep{ opacity:.5; margin:0 5px; }
/* Per-section color legend (top-left of each section's card area on desktop) */
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; margin:2px 0 12px; padding:0 4px; }
.legend .lg{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft);
  letter-spacing:.02em; white-space:nowrap; }
.legend .lg-sw{ width:11px; height:11px; border-radius:3px; background:var(--c); flex:none;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--c) 45%, transparent); }
.dot{ position:relative; z-index:2; width:13px; height:13px; border-radius:50%;
  background:var(--c); border:2px solid var(--c);
  box-shadow:0 0 0 4px var(--ground); }
/* Confidence is encoded by the dot's FILL + EDGE (colour still carries the thematic group):
   Scriptural = solid · Historical = open, firm edge · Traditional = open, dotted ·
   Relative = open, dashed (+ dashed stem + "≈" date). */
.node[data-tier="Historical"] .dot{ background:var(--ground); }
.node[data-tier="Traditional"] .dot{ background:var(--ground); border-style:dotted; }
.node[data-tier="Relative"] .dot{ background:var(--ground); border-style:dashed; }
.card{ position:relative; z-index:3; text-align:left; cursor:pointer; font:inherit;
  background:color-mix(in oklab, var(--c) 7%, var(--surface)); color:var(--ink);
  border:1px solid color-mix(in oklab, var(--c) 20%, var(--hair));
  border-top:3.5px solid var(--c); border-radius:9px; padding:11px 12px 12px;
  box-shadow:var(--shadow); transition:box-shadow .16s ease, border-color .16s;
  display:block; width:100%; }
.card:hover{ box-shadow:var(--shadow-lift); }
.card .cdate{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; color:var(--c);
  letter-spacing:.01em; display:flex; align-items:baseline; gap:7px; }
.card .cam{ color:var(--ink-faint); font-weight:400; font-size:10.5px; }
.card .ctitle{ font-family:"Fraunces",serif; font-size:15px; font-weight:600; line-height:1.16;
  margin:5px 0 0; color:var(--ink); }
.card .chips-row{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; align-items:center; }
.tag{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:600;
  padding:2px 6px; border-radius:4px; white-space:nowrap;
  color:var(--c); background:color-mix(in oklab, var(--c) 15%, transparent); }
.heb{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:0; text-transform:none;
  color:var(--gold); background:color-mix(in oklab, var(--gold) 14%, transparent);
  padding:2px 6px; border-radius:4px; white-space:nowrap; font-weight:500; }
.card .detail{ display:none; margin-top:9px; padding-top:9px; border-top:1px dashed var(--hair); }
.card.open .detail{ display:block; }
.card .notes{ font-size:12px; color:var(--ink-soft); line-height:1.5; }
.card .src{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-faint);
  margin-top:7px; display:block; }
.card .more{ font-size:10px; color:var(--ink-faint); letter-spacing:.08em; text-transform:uppercase;
  margin-top:8px; display:block; }
.card.open .more{ display:none; }

/* reveal */
.reveal{ opacity:.001; transform:translateY(12px); }
.node.in .card,.node.in .dot{ }
.node.in.reveal{ opacity:1; transform:none; transition:opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1); }

/* ---------- MOBILE (vertical, top -> bottom) : base ---------- */
.stage{ overflow:visible; }
.rail{ display:flex; flex-direction:column; padding:6px 0 40px; }
.rail::before{ top:0; bottom:0; left:23px; width:2px; }
.era{ display:flex; flex-direction:column; }
.era-head{ padding:30px 20px 16px 20px; display:grid; grid-template-columns:auto 1fr; gap:0 16px;
  align-items:center; border-top:1px solid var(--hair); margin-top:8px; }
.era:first-child .era-head{ border-top:0; margin-top:0; }
.rn-big{ font-size:34px; grid-row:span 2; width:34px; text-align:center; }
.era-name{ font-size:23px; }
.era-blurb{ font-size:13px; grid-column:2; }
.era-meta{ grid-column:2; margin-top:4px; }
.node{ display:grid; grid-template-columns:48px 1fr; align-items:start; padding:7px 20px 7px 0; }
.dot{ grid-column:1; justify-self:center; margin-top:9px; }
.node .stem{ display:none; }
.card{ grid-column:2; max-width:520px; }

/* ---------- DESKTOP (horizontal, left -> right) ---------- */
@media (min-width:880px){
  /* Legend floats at the top-left of the card area, just right of the title card. */
  .legend{ position:absolute; left:256px; top:16px; z-index:3; flex-direction:column;
    flex-wrap:nowrap; gap:6px; margin:0; padding:0; max-width:170px; }
  /* Time-to-scale layout: nodes are absolutely placed on a real year axis; JS sets
     --x (dot position), --lane-off (vertical lane), and the rail width/height. */
  .stage{ overflow-x:auto; overflow-y:hidden;
    scroll-behavior:smooth; cursor:grab; scrollbar-width:thin;
    scrollbar-color:color-mix(in oklab, var(--gold) 42%, var(--ink-faint)) transparent; }
  .stage.grabbing{ cursor:grabbing; scroll-behavior:auto; }
  .stage::-webkit-scrollbar{ height:12px; }
  .stage::-webkit-scrollbar-track{ background:color-mix(in oklab, var(--ink) 4%, transparent);
    border-radius:12px; margin:0 10px; }
  .stage::-webkit-scrollbar-thumb{ background:color-mix(in oklab, var(--gold) 42%, var(--ink-faint));
    border-radius:12px; border:3px solid var(--ground); }
  .stage::-webkit-scrollbar-thumb:hover{ background:color-mix(in oklab, var(--gold) 64%, var(--ink-soft)); }
  .rail{ display:block; position:relative; padding:0; }
  .rail::before{ left:0; right:0; bottom:var(--axis-b,64px); top:auto; height:2px; width:auto; }
  .era{ position:absolute; top:0; bottom:0; left:var(--era-left,0); width:var(--era-w,0); display:block; }
  /* section cover card (intro) at the start of each era */
  .era-head{ position:absolute; left:var(--cover-x,0); top:0; bottom:0;
    width:236px; z-index:2; pointer-events:none; margin:0; border-radius:0;
    display:flex; flex-direction:column; justify-content:center; gap:14px; padding:34px 26px;
    background:color-mix(in oklab, var(--tint) 17%, var(--surface));
    border-left:1px solid color-mix(in oklab, var(--tint) 36%, var(--hair));
    border-right:1px solid color-mix(in oklab, var(--tint) 36%, var(--hair)); }
  .rn-big{ font-family:"Fraunces",serif; font-weight:600;
    color:color-mix(in oklab, var(--tint) 72%, var(--ink));
    font-size:52px; line-height:.72; opacity:1; width:auto; }
  .era-name{ display:block; font-size:19px; line-height:1.06; max-width:none; }
  .era-blurb{ display:block; font-size:12px; color:var(--ink-soft); max-width:none; }
  .era-meta{ display:block; }
  .node{ position:absolute; top:0; bottom:0; width:0; left:var(--x,0); display:block; padding:0; }
  .dot{ position:absolute; left:0; bottom:var(--axis-b,64px); top:auto; transform:translate(-50%,50%); margin:0; }
  .node .stem{ display:block; position:absolute; left:0; width:2px; background:var(--c);
    opacity:.7; transform:translateX(-50%); z-index:1; }
  .node[data-pos="up"] .stem{ bottom:var(--axis-b,64px); height:var(--lane-off,28px); }
  .node[data-pos="down"] .stem{ top:50%; height:var(--lane-off,28px); }
  /* Relative events: a dashed stem to match the dashed dot */
  .node[data-tier="Relative"] .stem{ background:none; border-left:2px dashed var(--c); width:0; opacity:.85; }
  .card{ position:absolute; left:0; width:112px; transform:translateX(-50%); margin:0;
    padding:7px 9px 8px; }
  .node[data-pos="up"] .card{ bottom:calc(var(--axis-b,64px) + var(--lane-off,28px)); }
  .node[data-pos="down"] .card{ top:calc(50% + var(--lane-off,28px)); }
  /* compact by default (keeps lanes shallow); click reveals the rest */
  .card:not(.open) .ctitle{ font-size:13px; line-height:1.2; margin-top:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-height:2.5em; }
  .card .cdate{ font-size:11px; }
  .card:not(.open) .chips-row, .card:not(.open) .more, .card:not(.open) .detail{ display:none; }
  .card.open{ z-index:25; width:190px; }
  .card.open .ctitle{ -webkit-line-clamp:unset; }
  .card.open .detail{ display:block; }
}

/* progress (desktop only) */
.progress{ display:none; }
@media (min-width:880px){
  .progress{ display:flex; align-items:center; gap:14px; padding:9px clamp(16px,4vw,44px);
    border-top:1px solid var(--hair); background:var(--ground); }
  .progress-track{ flex:1; height:3px; background:var(--hair); border-radius:3px; overflow:hidden; }
  .progress-fill{ display:block; height:100%; width:0; background:var(--gold-line); }
  .progress-era{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
    white-space:nowrap; min-width:0; }
  .progress-era b{ color:var(--gold); font-weight:600; }
  .hint{ font-size:11px; color:var(--ink-faint); white-space:nowrap; }
}

/* ============================ FOOTER ============================ */
.footer{ border-top:1px solid var(--hair); padding:clamp(30px,5vw,56px) clamp(20px,5vw,64px);
  background:var(--ground-2); }
.footer h2{ font-size:22px; margin:0 0 4px; }

.tiers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px 26px;
  margin:0 0 34px; }
.tier{ display:grid; grid-template-columns:auto 1fr; gap:0 12px; align-items:start; }
.tier .mk{ width:13px; height:13px; border-radius:50%; margin-top:4px;
  background:var(--c); border:2px solid var(--c); }
.tier.hollow .mk{ background:transparent; }
.tier .tn{ font-weight:600; font-size:14px; }
.tier .tn .cnt{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint);
  font-weight:400; margin-left:6px; }

  color:var(--ink-faint); letter-spacing:.02em; }

@media (prefers-reduced-motion:reduce){
  *{ scroll-behavior:auto !important; }
  .reveal,.node.in.reveal{ opacity:1 !important; transform:none !important; transition:none !important; }
  .card{ transition:none; }
}

<div class="page">
  <div class="controls">
    <div class="controls-row search-row">
      <input class="search" id="search" type="search" placeholder="Search events, people, sources&#8230;" autocomplete="off" aria-label="Search the timeline">
      <button class="icon-btn theme-corner" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">&#9680;</button>
    </div>
    <div class="eranav" id="eranav"></div>
    <div class="controls-row keyrow">
      <span class="ckey" id="ckey"></span>
      <span class="ckey-hint">click to filter</span>
    </div>
  </div>

  <div class="stagewrap">
    <div class="stage" id="stage" tabindex="0" aria-label="Timeline. Use arrow keys to scroll.">
      <div class="rail" id="rail"></div>
    </div>
  </div>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const RN = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII"];
  // Four confidence tiers. The dot's shape (not colour) encodes the tier.
  const TIERS = {
    Scriptural:{blurb:"Fixed by the biblical text and its own intervals"},
    Historical:{blurb:"Pinned by an extra-biblical record"},
    Traditional:{blurb:"Early-church tradition or a prophetic reading"},
    Relative:{blurb:"Placed by reign-sequencing between the anchors"}
  };
  const ORDER = ["Scriptural","Historical","Traditional","Relative"];

  const dash = s => (s||"").replace(/–/g,"&ndash;").replace(/—/g,"&mdash;");

  // ---- ERA NAV ----
  document.getElementById("eranav").innerHTML = DATA.eras.map((e,i)=>
    `<button class="pill" data-era="${e.key}"><span class="rn">${RN[i+1]}</span>${e.name}</button>`).join("");

  // ---- BUILD RAIL ----
  const rail = document.getElementById("rail");
  const LABELS={birth:"Births",death:"Deaths",covenant:"Covenant",exodus:"Exodus",kingdom:"Reign",
    temple:"Temple",prophet:"Prophecy",judgment:"Judgment",restoration:"Restoration",powers:"Empires",
    maccabees:"Maccabees",messiah:"Messiah",church:"Church",event:"Event",
    conquest:"Conquest",deliverer:"Deliverers",mission:"Missions",martyr:"Martyrs",
    early:"Early Church",orthodox:"Orthodox",catholic:"Catholic",protestant:"Protestant",empire:"Empire"};
  // church-history TYPE markers (card glyph), keyed by the type half of the "Branch|Type" category
  const TMARK={council:"⚖︎",leader:"✦",mission:"→",schism:"✕",
    empire:"♛",martyr:"†",writing:"✍︎"};
  let html = ""; let idx = 0;
  DATA.eras.forEach((era,ei)=>{
    html += `<section class="era" id="era-${era.key}" data-era="${era.key}">`;
    html += `<header class="era-head"><span class="rn-big">${RN[ei+1]}</span>`+
            `<div class="era-name">${era.name}</div>`+
            `<div class="era-blurb">${era.blurb}</div>`+
            `<div class="era-meta"><b>${dash(era.range)}</b> &#183; ${era.count} events</div></header>`;
    const evs = DATA.events.filter(e=>e.era===era.key);
    const lgroups=[...new Set(evs.map(e=>e.group||"event"))];
    html += `<div class="legend" aria-hidden="true">`+lgroups.map(g=>
      `<span class="lg"><span class="lg-sw g-${g}"></span>${LABELS[g]||g}</span>`).join("")+`</div>`;
    evs.forEach((e)=>{
      const pos = "up"; idx++;   // all cards stack upward from the axis (no zigzag)
      const am = e.am ? `<span class="cam">AM ${e.am}</span>` : "";
      const heb = e.hmonth ? `<span class="heb">Month ${e.hmonth}${e.hday?` Day ${e.hday}`:""}</span>` : "";
      const hebRow = heb ? `<div class="chips-row">${heb}</div>` : "";
      const notes = e.notes ? `<div class="notes">${escapeHtml(e.notes)}</div>` : "";
      const src = e.source ? `<span class="src">${escapeHtml(e.source)}</span>` : "";
      const tier = e.confidence || "";
      const rel = tier === "Relative";
      // church-history "Branch|Type" category -> a type marker glyph + a spelled-out label
      const cat = e.category || "";
      const cparts = cat.includes("|") ? cat.split("|").map(s=>s.trim()) : ["",""];
      const ctype = (cparts[1]||"").toLowerCase();
      const mk = TMARK[ctype] ? `<span class="tmark">${TMARK[ctype]}</span>` : "";
      const catTxt = cat.includes("|") ? ` <span class="sep">·</span> ${escapeHtml(cparts[0])} · ${escapeHtml(cparts[1])}` : "";
      const conf = tier ? `<div class="conf"><span class="kd kd-${tier.toLowerCase()}"></span>${escapeHtml(tier)}${catTxt}</div>` : "";
      html += `<div class="node g-${e.group||"event"}" data-year="${e.year}" `+
        `data-pos="${pos}" data-tier="${escapeAttr(tier)}" data-txt="${escapeAttr((e.event+" "+e.source+" "+e.notes+" "+cat).toLowerCase())}">`+
        `<span class="stem"></span><span class="dot"></span>`+
        `<button class="card" aria-expanded="false">`+
          `<span class="cdate mono">${mk}${rel?"&#8776;&#8202;":""}${e.date}${am}</span>`+
          `<div class="ctitle">${escapeHtml(e.event)}</div>`+
          hebRow +
          `<div class="detail">${notes}${src}${conf}</div><span class="more">+ details</span>`+
        `</button></div>`;
    });
    html += `</section>`;
  });
  rail.innerHTML = html;

  function escapeHtml(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;").replace(/[<>]/g,""); }

  // ---- FILTERING + CLICKABLE CONFIDENCE KEY (each item shows/hides its tier) ----
  const nodes = Array.from(rail.querySelectorAll(".node"));
  const eras = Array.from(rail.querySelectorAll(".era"));
  const searchEl = document.getElementById("search");
  let q = "";
  const hiddenTiers = new Set();                     // tiers toggled off via the key
  const tierHidden = n => hiddenTiers.has(n.dataset.tier);

  // Build the confidence key as clickable filters, from the tiers actually present, in ORDER.
  const tierCounts = {};
  nodes.forEach(n=>{ const t=n.dataset.tier; if(t) tierCounts[t]=(tierCounts[t]||0)+1; });
  const ckey = document.getElementById("ckey");
  if(ckey) ckey.innerHTML = ORDER.filter(t=>tierCounts[t]).map(t=>
    `<button class="ci" type="button" data-tier="${t}" aria-pressed="true" `+
    `title="${(TIERS[t]||{}).blurb||''} — click to show / hide">`+
    `<span class="kd kd-${t.toLowerCase()}"></span>${t}<span class="ct">${tierCounts[t]}</span></button>`).join("");

  function apply(){
    nodes.forEach(n=>{ n.hidden = (q && n.dataset.txt.indexOf(q) < 0) || tierHidden(n); });
    eras.forEach(er=>{ er.hidden = !er.querySelector('.node:not([hidden])'); });
  }
  searchEl.addEventListener("input",()=>{ q = searchEl.value.trim().toLowerCase(); apply(); });
  if(ckey) ckey.addEventListener("click",e=>{
    const b = e.target.closest(".ci"); if(!b) return;
    const t = b.dataset.tier;
    hiddenTiers.has(t) ? hiddenTiers.delete(t) : hiddenTiers.add(t);
    b.setAttribute("aria-pressed", hiddenTiers.has(t) ? "false" : "true");
    apply(); relayout(); updateProgress();
  });
  apply();

  // ---- CARD EXPAND ----
  rail.addEventListener("click",e=>{
    if(justDragged) return;
    const card = e.target.closest(".card"); if(!card) return;
    const open = card.classList.toggle("open");
    card.setAttribute("aria-expanded", open?"true":"false");
  });

  // ---- ERA NAV SCROLL ----
  const stage = document.getElementById("stage");
  // Detect the ACTIVE layout from applied CSS (the horizontal stage sets overflow-x:auto;
  // the vertical/mobile stage is overflow:visible). More reliable than matchMedia.
  const isDesk = ()=> getComputedStyle(stage).overflowX !== "visible";

  // ---- TIME-TO-SCALE LAYOUT (desktop): absolute x from real years + vertical lane packing ----
  const PX=12, PAD=140, CARD_W=112, CARD_H=72, LANE_GAP=16, BASE=48, GUTTER=12, AXIS_BOTTOM=64;
  // Per-era minimum horizontal step between consecutive cards (px). 0 = pure proportional.
  // A positive value cascades same-year / near-year piles into a readable fanned deck.
  const TIE={exodus:60, judges:15, united:36, divided:26, exile:30, return:26, apostolic:22, john:20,
    antenicene:24, imperial:26, byzantine:22, medieval:24, reformation:26};
  function layoutDesktop(){
    const ns = Array.from(rail.querySelectorAll(".node")).filter(n=>!tierHidden(n)); if(!ns.length) return;
    const eras = Array.from(rail.querySelectorAll(".era"));
    // Global piecewise time scale. Each [year, px/yr] sets the rate FROM that year until the
    // next break, so horizontal distance is ALWAYS proportional to the year-gap (no minimum
    // spacing — same-year events share an x and simply stack in lanes). Base rate ~4 px/yr;
    // sparse eras are compressed below it, dense / important eras dilated above it:
    //  4004-1950 BC creation->Abraham 25% · judges & divided monarchy compressed ·
    //  605-561 Exile 3.25x · 539-430 Return 2x · 200 BC on ~1.5x · 5BC-30AD Jesus & 34-68 apostolic dilated
    const SEG=[[-4004,1.0],
      [-2360,4.5],[-2126,1.85],[-2008,4.8],[-1950,7],[-1810,4.6],[-1685,3.1],
      [-1491,20],[-1490,6.3],[-1452,20],
      [-1451,5.5],[-1095,5.5],[-975,13],
      [-605,16],[-597,24],[-593,13],[-589,130],[-584,13],[-561,5.0],
      [-539,9],
      [-430,2.2],[-200,6.0],[-176,15.0],[-133,6.0],[-63,9.0],
      [-5,125],[-4,14],[6,62],[8,9],[26,125],[27,45],[30,8.0],
      [34,28.0],
      [68,42],[73,8.5],[90,26],[95,32],
      [99,5.5],[313,7],[476,2.1],[1054,2.6],[1517,4.2]];
    const segX = y => { let x=0; for(let i=0;i<SEG.length;i++){ const s=SEG[i][0], r=SEG[i][1],
      e=(i+1<SEG.length)?SEG[i+1][0]:1e9; if(y>s) x+=(Math.min(y,e)-s)*r; } return x; };
    const COVER_W=236, COVER_LEAD=104, LEAD_BEFORE=96, END_GAP=64;
    const xs=new Map(), eraL=new Map(), eraR=new Map(), coverX=new Map();
    const eord=[]; let cursor=0;
    eras.forEach(era=>{
      const en=Array.from(era.querySelectorAll(".node")).filter(n=>!tierHidden(n)); if(!en.length) return;
      eord.push(era);
      const zoneLeft=cursor; coverX.set(era, cursor+LEAD_BEFORE);
      const base=cursor+LEAD_BEFORE+COVER_W+COVER_LEAD;
      const eMinX=segX(Math.min.apply(null, en.map(n=>+n.dataset.year)));
      // x is the true year-scaled offset from the era's first event (pure proportional).
      // TIE[era] adds a minimum horizontal step between consecutive cards, cascading a
      // same-year / near-year pile into a readable fanned deck instead of one flat stack.
      const tie=TIE[era.dataset.era]||0;
      let maxX=base, prevX=-1e9;
      en.forEach(n=>{ let x=base+(segX(+n.dataset.year)-eMinX);
        if(tie && x<prevX+tie) x=prevX+tie;
        xs.set(n,x); prevX=x; if(x>maxX) maxX=x; });
      eraL.set(era, zoneLeft); eraR.set(era, maxX+END_GAP); cursor=maxX+END_GAP;
    });
    const totalW=Math.round(cursor);
    // Background bands begin just before their OWN title card and run to just before the
    // NEXT title card, so the trailing gap after a section's last event is that section's
    // color (padding-right on the previous section) instead of the next section's — which
    // used to make each new background start ~96px too early, up against the prior events.
    const PRECOVER=0;
    eord.forEach((era,i)=>{
      eraL.set(era, i===0 ? Math.max(0, coverX.get(era)-PRECOVER) : coverX.get(era)-PRECOVER);
      eraR.set(era, i<eord.length-1 ? coverX.get(eord[i+1])-PRECOVER : cursor);
    });
    // greedy lane packing per side (left -> right) so cards never overlap
    const up=[], down=[], off=new Map();
    ns.slice().sort((a,b)=>xs.get(a)-xs.get(b)).forEach(n=>{
      const arr=n.dataset.pos==="up"?up:down; const left=xs.get(n)-CARD_W/2;
      let l=0; while(l<arr.length && arr[l]>left-GUTTER) l++; arr[l]=xs.get(n)+CARD_W/2; off.set(n,l); });
    const maxL=Math.max(up.length,down.length,1), minStep=CARD_H+LANE_GAP;
    // Fill the viewport: the stage runs from just under the sticky header to the bottom of the page.
    // Lanes then spread across that height — step grows from the no-overlap minimum up to a tasteful
    // cap; any surplus becomes headroom (open sky) above the tallest card. Axis stays pinned bottom.
    const availH=Math.max(0, Math.round(window.innerHeight - stage.getBoundingClientRect().top - 8));
    const contentMinH=AXIS_BOTTOM+BASE+maxL*minStep+16;
    const stageH=Math.max(contentMinH, availH);
    const step=Math.min(150, Math.max(minStep, (stageH-AXIS_BOTTOM-BASE-16)/maxL));
    rail.style.setProperty("--axis-b", AXIS_BOTTOM+"px");
    eras.forEach(era=>{ if(!eraL.has(era)) return; const L=Math.max(0,eraL.get(era));
      era.style.setProperty("--era-left",Math.round(L)+"px");
      era.style.setProperty("--era-w",Math.round(eraR.get(era)-L)+"px");
      const head=era.querySelector(".era-head"); if(head) head.style.setProperty("--cover-x",Math.round(coverX.get(era)-L)+"px"); });
    ns.forEach(n=>{ const era=n.closest(".era"); const L=Math.max(0,eraL.get(era)||0);
      n.style.setProperty("--x",Math.round(xs.get(n)-L)+"px");
      n.style.setProperty("--lane-off",(BASE+off.get(n)*step)+"px"); });
    rail.style.width=totalW+"px"; rail.style.height=stageH+"px"; stage.style.height=stageH+"px";
  }
  function clearLayout(){ rail.style.width=""; rail.style.height=""; stage.style.height="";
    rail.querySelectorAll(".node").forEach(n=>{ n.style.removeProperty("--x"); n.style.removeProperty("--lane-off"); }); }
  function relayout(){ isDesk() ? layoutDesktop() : clearLayout(); }

  document.getElementById("eranav").addEventListener("click",e=>{
    const p = e.target.closest(".pill"); if(!p) return;
    const el = document.getElementById("era-"+p.dataset.era);
    if(!el) return;
    if(isDesk()){
      stage.scrollTo({left: el.offsetLeft - 12, behavior:"smooth"});
    } else {
      el.scrollIntoView({behavior:"smooth", block:"start"});
    }
  });

  // ---- WHEEL -> HORIZONTAL + DRAG PAN (desktop) ----
  stage.addEventListener("wheel",e=>{
    if(!isDesk()) return;
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ stage.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive:false});
  let down=false, sx=0, sl=0, justDragged=false;
  stage.addEventListener("pointerdown",e=>{
    if(!isDesk() || e.target.closest("a")) return;
    down=true; justDragged=false; sx=e.clientX; sl=stage.scrollLeft;
  });
  stage.addEventListener("pointermove",e=>{
    if(!down) return;
    const dx = e.clientX - sx;
    if(Math.abs(dx)>5){ justDragged=true; stage.classList.add("grabbing"); }
    stage.scrollLeft = sl - dx;
  });
  function endDrag(){ down=false; stage.classList.remove("grabbing");
    setTimeout(()=>justDragged=false, 40); }
  stage.addEventListener("pointerup",endDrag);
  stage.addEventListener("pointerleave",endDrag);
  stage.addEventListener("keydown",e=>{
    if(!isDesk()) return;
    const step = stage.clientWidth*0.8;
    if(e.key==="ArrowRight"){ stage.scrollLeft+=step; e.preventDefault(); }
    else if(e.key==="ArrowLeft"){ stage.scrollLeft-=step; e.preventDefault(); }
    else if(e.key==="Home"){ stage.scrollLeft=0; e.preventDefault(); }
    else if(e.key==="End"){ stage.scrollLeft=stage.scrollWidth; e.preventDefault(); }
  });

  // ---- CURRENT-ERA HIGHLIGHT (desktop horizontal + mobile vertical) ----
  const pfill=document.getElementById("pfill"), pera=document.getElementById("pera");
  const eranavEl=document.getElementById("eranav");
  let lastEraKey=null;
  function setActiveEra(key){
    if(key===lastEraKey) return; lastEraKey=key;
    const i=DATA.eras.findIndex(x=>x.key===key); if(i<0) return;
    const meta=DATA.eras[i];
    if(pera) pera.innerHTML = `<b>${RN[i+1]}</b> &#183; ${meta.name} &#183; ${dash(meta.range)}`;
    let activePill=null;
    document.querySelectorAll(".pill").forEach(pl=>{ const on=pl.dataset.era===key;
      pl.classList.toggle("active",on); if(on) activePill=pl; });
    if(activePill){
      const target=activePill.offsetLeft - eranavEl.clientWidth/2 + activePill.offsetWidth/2;
      eranavEl.scrollTo({left:Math.max(0,target), behavior:"smooth"});
    }
  }
  function updateProgress(){
    if(isDesk()){
      const max = stage.scrollWidth - stage.clientWidth;
      if(pfill) pfill.style.width = (max>0 ? stage.scrollLeft/max*100 : 0).toFixed(1)+"%";
      const mid = stage.scrollLeft + stage.clientWidth/2;
      let cur=eras.find(e=>!e.hidden);
      for(const er of eras){ if(!er.hidden && er.offsetLeft<=mid) cur=er; }
      if(cur) setActiveEra(cur.dataset.era);
    } else {
      const probe = document.querySelector(".controls").getBoundingClientRect().bottom + window.innerHeight*0.16;
      let cur=eras.find(e=>!e.hidden);
      for(const er of eras){ if(er.hidden) continue; if(er.getBoundingClientRect().top<=probe) cur=er; }
      if(cur) setActiveEra(cur.dataset.era);
    }
  }
  stage.addEventListener("scroll",()=>{ requestAnimationFrame(updateProgress); }, {passive:true});
  window.addEventListener("scroll",()=>{ if(!isDesk()) requestAnimationFrame(updateProgress); }, {passive:true});

  // ---- REVEAL ON SCROLL (first frame visible) ----
  const reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const io = new IntersectionObserver((ents)=>{
    ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  }, {root: null, rootMargin:"0px 12% 0px 12%", threshold:0.01});
  // observe with the stage as root on desktop for horizontal reveal
  const ioH = new IntersectionObserver((ents)=>{
    ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); ioH.unobserve(en.target); } });
  }, {root: stage, rootMargin:"0px 12% 0px 12%", threshold:0.01});
  function setupReveal2(){
    if(reduce) return;
    const horiz = isDesk();
    const vw = stage.clientWidth || window.innerWidth;
    const vh = window.innerHeight;
    const obs = horiz ? ioH : io;
    nodes.forEach(n=>{
      const r = n.getBoundingClientRect();
      const inFrame = horiz ? (r.left < vw + 40) : (r.top < vh + 40);
      if(!inFrame){ n.classList.add("reveal"); requestAnimationFrame(()=>obs.observe(n)); }
    });
  }

  // ---- THEME TOGGLE ----
  const themeBtn = document.getElementById("theme");
  try{ const saved = localStorage.getItem("am-theme"); if(saved) document.documentElement.setAttribute("data-theme",saved); }catch(e){}
  themeBtn.addEventListener("click",()=>{
    const cur = document.documentElement.getAttribute("data-theme");
    const sysDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
    const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("am-theme",next); }catch(e){}
  });

  // ---- INIT ----
  requestAnimationFrame(()=>{ relayout(); setupReveal2(); updateProgress(); });
  let rT; window.addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ relayout(); updateProgress(); },120); });
})();
</script>
