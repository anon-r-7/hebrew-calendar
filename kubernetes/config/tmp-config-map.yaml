apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-conf
  namespace: default
data:
  default.conf: |
    server {
      listen       80;
      server_name  localhost;

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
      }

      location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }
