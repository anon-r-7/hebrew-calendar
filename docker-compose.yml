services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hebrew_feasts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # postgres 18+ images keep data in a version-named subdirectory under this mount
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hebrew_feasts}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api.dockerfile
      target: prod
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${SERVER_PORT:-5001}:${SERVER_PORT:-5001}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-5001}
      TZ: 'UTC'
      # inside compose the database is the `db` service, whatever .envrc says for host runs
      DB_ENDPOINT: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hebrew_feasts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hebrew_feasts}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
    depends_on:
      db:
        condition: service_healthy

  # ui:
