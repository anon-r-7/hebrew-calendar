      #     DO_APP_ID="your-app-id" # Replace with your DigitalOcean App ID
      #     DO_IMAGE="ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}"
      #     curl -X PUT -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" -d "{\"image\":\"$DO_IMAGE\"}" "https://api.digitalocean.com/v2/apps/$DO_APP_ID"

  ui:
    runs-on: "ubuntu-20.04"
    steps:
      - uses: actions/checkout@v2

      - name: Build and publish a Docker image for ${{ github.repository }}
        uses: macbre/push-to-ghcr@v13
        with:
          image_name: ${{ github.repository }}-ui
          dockerfile: "ui.dockerfile"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Auto update Digital Ocean when new tag is pulled in
